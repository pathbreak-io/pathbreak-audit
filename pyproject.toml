[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pathbreak-audit"
version = "0.1.0"
description = "See the abusable IAM permissions your principals hold, so you can tighten them before an attacker does. A read-only tool for defenders, from the team behind Pathbreak."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Pathbreak", email = "hello@pathbreak.io" }]
keywords = ["aws", "iam", "security", "privilege-escalation", "least-privilege", "cspm", "cloud-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["boto3>=1.26"]

[project.urls]
Homepage = "https://pathbreak.io"
"Attack Map" = "https://pathbreak.io/aws-privilege-escalation-map"
Source = "https://github.com/pathbreak-io/pathbreak-audit"

[project.scripts]
pathbreak-audit = "pathbreak_audit.cli:main"

[tool.setuptools]
packages = ["pathbreak_audit"]

[tool.setuptools.package-data]
pathbreak_audit = ["data/*.json"]
